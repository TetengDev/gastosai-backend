# Production overrides. Activate with SPRING_PROFILES_ACTIVE=prod. The base application.properties
# holds dev-friendly defaults; only production-specific hardening lives here.

# Connection pool sized for the 512 MB Koyeb free tier (small, bounded).
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=10000

# Never seed sample data against a real database.
gastos.seed-sample-data=false

# Enforce subscription entitlements in production (flip on once billing is wired; safe default here).
# Leave false until a payment provider is integrated.
gastos.monetization.enforce=${MONETIZATION_ENFORCE:false}

# Expose health (for orchestration liveness/readiness) in addition to info.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Quieter, structured-friendly logging in production.
logging.level.root=INFO
logging.level.com.teng.app.gastosai=INFO
logging.level.org.hibernate.SQL=WARN
spring.jpa.show-sql=false
