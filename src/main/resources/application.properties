spring.application.name=gastosai

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gastos}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:dev}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# AI Provider Configuration (openai or claude)
gastos.ai.provider=${GASTOS_AI_PROVIDER:openai}
# Secret used to encrypt user-supplied AI provider keys at rest (set in production).
gastos.ai.key-encryption-secret=${AI_KEY_ENCRYPTION_SECRET:gastos-dev-ai-key-encryption-secret-change-me}
# When false (default), AI features require each user's own key; no fallback to the server key.
gastos.ai.allow-shared-key=${AI_ALLOW_SHARED_KEY:false}

# Managed AI feature flags and limits
gastos.ai.features-enabled=${AI_FEATURES_ENABLED:true}
gastos.ai.request-timeout-seconds=${AI_REQUEST_TIMEOUT_SECONDS:30}
gastos.ai.max-prompt-chars=${AI_MAX_PROMPT_CHARS:8000}
gastos.ai.quota-free=${AI_MONTHLY_FREE_QUOTA:30}
gastos.ai.quota-premium=${AI_MONTHLY_PREMIUM_QUOTA:300}
gastos.ai.quota-trial=${AI_MONTHLY_TRIAL_QUOTA:50}
gastos.ai.vision-free=${AI_VISION_FREE_QUOTA:5}
gastos.ai.vision-premium=${AI_VISION_PREMIUM_QUOTA:50}
gastos.ai.vision-trial=${AI_VISION_TRIAL_QUOTA:10}
gastos.ai.absolute-monthly-cap=${AI_ABSOLUTE_MONTHLY_CAP:1000}
# Global daily AI request backstop across all users (admin-exempt). Regardless of MONETIZATION_ENFORCE.
gastos.ai.global-daily-max=${AI_GLOBAL_DAILY_MAX:2000}

# AI cost estimation (USD per million tokens). Defaults match gpt-4o-mini pricing.
gastos.ai.cost.input-per-mtok-usd=${AI_COST_INPUT_PER_MTOK_USD:0.15}
gastos.ai.cost.output-per-mtok-usd=${AI_COST_OUTPUT_PER_MTOK_USD:0.60}

# Server-side cache for AI insight responses (per user+month); evicted on expense changes.
gastos.insights.cache.enabled=${INSIGHTS_CACHE_ENABLED:true}
gastos.insights.cache.ttl-minutes=${INSIGHTS_CACHE_TTL_MINUTES:15}
gastos.insights.cache.max-size=${INSIGHTS_CACHE_MAX_SIZE:10000}

# OpenAI Configuration
gastos.openai.api-key=${OPENAI_API_KEY}
gastos.openai.model=${OPENAI_MODEL:gpt-4o-mini}

# Claude Configuration
gastos.claude.api-key=${CLAUDE_API_KEY:}
gastos.claude.model=${CLAUDE_MODEL:claude-3-5-sonnet-20241022}

# true = seed sample expenses when the table is empty (set GASTOS_SEED_SAMPLE_DATA=false in production)
gastos.seed-sample-data=${GASTOS_SEED_SAMPLE_DATA:true}

# Monetization: false = all features unlocked (beta). Flip to true to enforce plan entitlements.
gastos.monetization.enforce=${MONETIZATION_ENFORCE:false}

# Per-user/minute cap on the AI endpoints (they fan out to paid LLM providers).
gastos.ratelimit.ai-per-minute=${AI_RATE_LIMIT_PER_MINUTE:20}
# Per-IP/minute cap on public (unauthenticated) endpoints.
gastos.ratelimit.public-per-minute=${PUBLIC_RATE_LIMIT_PER_MINUTE:10}
# Global daily cap on magic-link sends across all users (anti-spam / cost control).
gastos.ratelimit.magic-link-daily-max=${MAGIC_LINK_DAILY_MAX:200}
# Per-IP daily registration cap (in-memory; per-JVM on multi-instance — use Redis before scaling out).
gastos.security.register-ip-daily-max=${REGISTER_IP_DAILY_MAX:5}
# Global daily new-account cap (DB count of users created today).
gastos.security.register-daily-max=${REGISTER_DAILY_MAX:100}
# Per-user/minute cap on authenticated write operations (POST/PUT/PATCH/DELETE) on app data paths.
gastos.ratelimit.write-per-minute=${WRITE_RATE_LIMIT_PER_MINUTE:60}
# Use Redis for rate-limit counters (cross-instance). Default false = per-JVM in-memory store.
gastos.ratelimit.redis.enabled=${RATELIMIT_REDIS_ENABLED:false}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Never expose stack traces in error responses (info-leak on unmatched/unhandled routes).
server.error.include-stacktrace=never

# Actuator: expose /actuator/info (build version) and /actuator/health (liveness for
# uptime pingers + the admin observability roll-up). Health detail is admin-only.
management.endpoints.web.exposure.include=health,info
management.endpoint.info.enabled=true
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
# Health reflects real liveness (app + DB). Mail and Redis are optional/best-effort
# (Resend over HTTP, in-memory rate-limit fallback) — a down check there does not mean
# the service is down, so exclude them or an uptime pinger would alert falsely.
management.health.mail.enabled=false
management.health.redis.enabled=false

# Operational alerts (cost / abuse / error-spike -> Telegram). Off by default; a no-op
# unless ALERTS_ENABLED=true AND the Telegram credentials are set. Reuses the same bot
# creds as the tooling scripts. Only fires while the instance is awake (see docs/observability.md).
gastos.alerts.enabled=${ALERTS_ENABLED:false}
gastos.alerts.bot-token=${TELEGRAM_BOT_TOKEN:}
gastos.alerts.chat-id=${TELEGRAM_CHAT_ID:}
gastos.alerts.interval-ms=${ALERT_INTERVAL_MS:900000}
gastos.alerts.daily-cost-usd=${ALERT_DAILY_COST_USD:5.00}
gastos.alerts.error-rate-per-hour=${ALERT_ERROR_RATE:20}
gastos.alerts.global-cap-warn-fraction=${ALERT_GLOBAL_CAP_FRACTION:0.9}

# Feature flags (override via env: GASTOS_FEATURES_CSV_IMPORT, GASTOS_FEATURES_CHAT_ATTACHMENTS)
gastos.features.csv-import=${GASTOS_FEATURES_CSV_IMPORT:true}
gastos.features.chat-attachments=${GASTOS_FEATURES_CHAT_ATTACHMENTS:true}

# Multipart upload limits (for CSV and image attachments)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# CSV import abuse limits — bound rows and per-field length so a crafted upload cannot
# exhaust memory or amplify storage (over the row cap the whole file is rejected).
gastos.import.max-rows=${IMPORT_MAX_ROWS:10000}
gastos.import.max-description-length=${IMPORT_MAX_DESCRIPTION_LENGTH:500}
gastos.import.max-category-length=${IMPORT_MAX_CATEGORY_LENGTH:100}

# CORS — comma-separated origins; set CORS_ALLOWED_ORIGINS in production (e.g. https://yourapp.vercel.app)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# JWT (override JWT_SECRET in production with a long random string)
# Token revocation and refresh tokens are deferred; shorten TTL as a compensating control.
gastos.jwt.secret=${JWT_SECRET:gastos-dev-secret-key-change-in-production-min-32-chars}
gastos.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# Google sign-in (scaffold: blank = disabled; set both this and the frontend VITE_GOOGLE_CLIENT_ID
# to the same OAuth client id to enable "Continue with Google").
gastos.auth.google.client-id=${GOOGLE_CLIENT_ID:}

# Admin account (set both env vars to auto-create an admin on startup; omit in production)
gastos.admin.email=${GASTOS_ADMIN_EMAIL:}
gastos.admin.password=${GASTOS_ADMIN_PASSWORD:}

# Demo / sample normal user (only active when gastos.seed-sample-data=true)
gastos.demo.name=${GASTOS_DEMO_NAME:Demo User}
gastos.demo.email=${GASTOS_DEMO_EMAIL:demo@gastosai.dev}
gastos.demo.password=${GASTOS_DEMO_PASSWORD:demo123}

# Email transport: Resend HTTP API takes priority when set (works on PaaS that block SMTP ports,
# e.g. Render free). Get a key at resend.com; for testing send from onboarding@resend.dev.
gastos.mail.resend.api-key=${RESEND_API_KEY:}

# SMTP fallback (used only if RESEND_API_KEY is unset and MAIL_HOST is set). Leave host blank for
# the logging fallback in dev. Timeouts bound the send so a blocked SMTP port fails fast (~10s)
# instead of hanging the request for ~2 minutes.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

gastos.mail.from=${MAIL_FROM:no-reply@gastosai.app}
gastos.app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}
gastos.magiclink.ttl-minutes=${MAGICLINK_TTL_MINUTES:15}
# Contact/feedback submissions are emailed here (best-effort; only actually sent when SMTP is configured).
gastos.contact.notification-email=${CONTACT_NOTIFICATION_EMAIL:lbfilao@gmail.com}

# PayMongo payment integration
gastos.paymongo.secret-key=${PAYMONGO_SECRET_KEY:}
gastos.paymongo.webhook-secret=${PAYMONGO_WEBHOOK_SECRET:}
gastos.paymongo.base-url=${PAYMONGO_API_BASE_URL:https://api.paymongo.com}

# Pricing (centavos)
gastos.pricing.premium-monthly-centavos=14900
gastos.pricing.premium-annual-centavos=129000
gastos.pricing.currency=PHP