# Testcontainers profile — the one place the test suite meets a real PostgreSQL.
#
# The default test profile derives its schema from the entities (H2 in PostgreSQL mode,
# ddl-auto=create-drop, Flyway off), so a migration that would fail in production can pass
# there unnoticed. This profile inverts that: Flyway owns the schema exactly as it does in
# prod, and Hibernate only validates the entities against what the migrations produced.
#
# The datasource itself is not configured here — the container declared by the test supplies
# url/username/password/driver through @ServiceConnection, which outranks any property.

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
