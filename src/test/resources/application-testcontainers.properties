# Testcontainers profile — for MigrationChainIntegrationTest, and only that class.
#
# It is no longer "the one place the suite meets real PostgreSQL": since TEN-241 the default
# profile is real PostgreSQL too, on one container shared by every Spring context, with Flyway
# owning the schema and ddl-auto=validate — the same settings repeated below.
#
# What this profile still buys is an EMPTY database. The shared container is migrated once by
# whichever context starts first and then accumulates rows, so it cannot show what a new
# environment sees; MigrationChainIntegrationTest declares its own container to apply V1..Vn from
# nothing. The datasource is deliberately not configured here — that container supplies
# url/username/password/driver through @ServiceConnection, which outranks any property.

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
