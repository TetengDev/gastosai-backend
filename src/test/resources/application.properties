# Provider base URLs: the dead loopback port, for the whole suite.
#
# This file shadows src/main/resources/application.properties entirely, so leaving these undeclared
# does not inherit the main file's values — it falls through to the @Value defaults, which are the
# real provider hosts. Nothing in the suite opens a provider socket today (every AI test mocks the
# client or the transport), but that is discipline, not construction: one test that forgets to mock,
# on a machine with a key in the environment, would call out for real.
#
# Port 9 is the discard port and nothing listens on it, so any such call is refused at connect
# before a byte leaves. Keep the Claude value's /v1 suffix: caller paths (/messages) are relative to
# the base URL. ProviderBaseUrlValidator admits loopback while the prod profile is not active.
gastos.openai.base-url=http://127.0.0.1:9
gastos.claude.base-url=http://127.0.0.1:9/v1

# OpenAI Configuration
gastos.openai.api-key=

# Claude Configuration
gastos.claude.api-key=${CLAUDE_API_KEY:}
gastos.claude.model=${CLAUDE_MODEL:claude-3-5-sonnet-20241022}

gastos.seed-sample-data=false

gastos.jwt.secret=test-secret-key-for-unit-tests-only-min-32-chars
gastos.jwt.expiration-ms=3600000

# SecurityStartupValidator treats any datasource URL that is neither jdbc:h2: nor localhost as
# production, and a Testcontainers `jdbc:tc:` URL is neither — so it now refuses to start unless
# this is set to something other than the dev default. Setting a real test value is the right
# answer anyway: the suite should not be leaning on a "looks like H2, must be safe" heuristic to
# get past a secrets guard.
gastos.ai.key-encryption-secret=test-ai-key-encryption-secret-for-tests-only

spring.mail.host=
gastos.app.frontend-base-url=http://localhost:5173
gastos.magiclink.ttl-minutes=15

# Mirror prod: health reflects app+DB only; mail/redis are optional/best-effort.
management.health.mail.enabled=false
management.health.redis.enabled=false
