# The whole suite runs against a real PostgreSQL 17 — the engine production runs — not H2.
#
# H2 in PostgreSQL compatibility mode emulates identifier casing, information_schema, partial
# indexes, ON CONFLICT, interval and timestamp arithmetic and native queries differently enough
# that a repository change could pass CI and fail in production. TEN-143 put the migration chain
# on a container; this profile puts everything else there too.
#
# `jdbc:tc:` is the Testcontainers JDBC driver, chosen deliberately over a per-class container
# field: it starts ONE container the first time a connection is opened and hands the same one to
# every Spring context in the JVM (containers are keyed by URL), so the ~40 @SpringBootTest
# classes cost one container, not forty. TC_DAEMON keeps it alive when a context is evicted from
# the test-context cache and its pool drains, instead of stopping it and starting another.
#
# It is also lazy: a test with no Spring context (parsers, redaction, SqlGuard, pure domain
# services) opens no connection, so it needs neither Docker nor a container. Only tests that
# start a context — which need a database anyway — pay for one.
#
# Per-test isolation comes from rollback or truncation, never from a fresh database:
# see com.teng.app.gastosai.support.PostgresBackedTest.
spring.datasource.url=jdbc:tc:postgresql:17:///gastosaitest?TC_DAEMON=true
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver

# Flyway owns the schema here exactly as it does in prod, and Hibernate only validates the
# entities against what the migrations produced. Never ddl-auto=create-drop: a suite that runs
# on a schema Hibernate generated for itself cannot catch entity/migration drift.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.show-sql=false

# AI Provider Configuration (openai or claude)
gastos.ai.provider=openai
gastos.ai.allow-shared-key=false
gastos.ai.features-enabled=true
gastos.ai.request-timeout-seconds=30
gastos.ai.max-prompt-chars=8000
gastos.ai.quota-free=30
gastos.ai.quota-premium=300
gastos.ai.quota-trial=50
gastos.ai.vision-free=5
gastos.ai.vision-premium=50
gastos.ai.vision-trial=10

# OpenAI Configuration
gastos.openai.api-key=

# Claude Configuration
gastos.claude.api-key=${CLAUDE_API_KEY:}
gastos.claude.model=${CLAUDE_MODEL:claude-3-5-sonnet-20241022}

gastos.seed-sample-data=false

gastos.jwt.secret=test-secret-key-for-unit-tests-only-min-32-chars
gastos.jwt.expiration-ms=3600000

# SecurityStartupValidator treats any datasource URL that is neither jdbc:h2: nor localhost as
# production, and a Testcontainers `jdbc:tc:` URL is neither — so it now refuses to start unless
# this is set to something other than the dev default. Setting a real test value is the right
# answer anyway: the suite should not be leaning on a "looks like H2, must be safe" heuristic to
# get past a secrets guard.
gastos.ai.key-encryption-secret=test-ai-key-encryption-secret-for-tests-only

spring.mail.host=
gastos.app.frontend-base-url=http://localhost:5173
gastos.magiclink.ttl-minutes=15

# Mirror prod: health reflects app+DB only; mail/redis are optional/best-effort.
management.health.mail.enabled=false
management.health.redis.enabled=false
