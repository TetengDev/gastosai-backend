services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: gastos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: >
      postgres
      -c shared_buffers=64MB
      -c effective_cache_size=128MB
      -c max_connections=20
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gastos"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 64m

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    env_file: ./.env
    environment:
      DB_URL: jdbc:postgresql://db:5432/gastos
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 256m
    profiles:
      - app

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    ports:
      - "5173:80"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 64m
        reservations:
          memory: 16m
    profiles:
      - app

volumes:
  postgres_data:
