services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: gastos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
    # Host 5433, not 5432: 5432 is usually taken by a machine-wide Postgres. This is the port
    # `spring.datasource.url` defaults to, so the local loop needs no DB_URL override.
    # A git worktree gets its own compose project and binds this same host port, so only one
    # stack can hold it at a time — parallel runtime verification needs a shared stack.
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: >
      postgres
      -c shared_buffers=64MB
      -c effective_cache_size=128MB
      -c max_connections=20
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gastos"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 64m

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    env_file:
      - path: ./.env
        required: false
      # Legacy location — kept so pre-consolidation setups still work; later entries win.
      - path: ./backend/.env
        required: false
    environment:
      DB_URL: jdbc:postgresql://db:5432/gastos
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 256m
    profiles:
      - app

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    ports:
      - "5173:80"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 64m
        reservations:
          memory: 16m
    profiles:
      - app

volumes:
  postgres_data:
