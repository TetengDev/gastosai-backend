# Fly.io config for the gastosai Spring Boot backend.
# Deploy from this directory: `flyctl launch --no-deploy` (first time) then `flyctl deploy`.
# Secrets (DB creds, JWT_SECRET, OPENAI_API_KEY, CORS_ALLOWED_ORIGINS) are set via
# `flyctl secrets set ...` — never commit them. See docs/deploy-testing-guide.md.

app = "gastosai-api"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

# Non-secret runtime config. Secrets are injected separately via `flyctl secrets set`.
[env]
  SPRING_PROFILES_ACTIVE = "prod"
  SPRING_JPA_HIBERNATE_DDL_AUTO = "validate"
  GASTOS_SEED_SAMPLE_DATA = "false"
  GASTOS_AI_PROVIDER = "openai"
  OPENAI_MODEL = "gpt-4o-mini"
  AI_RATE_LIMIT_PER_MINUTE = "10"
  MONETIZATION_ENFORCE = "false"

[http_service]
  internal_port = 8080
  force_https = true
  # Scale to zero when idle to stay within the free allowance (first request cold-starts).
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/actuator/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
