name: Auto Release

# Carried over from the monorepo, with two changes forced by the split:
#   1. The version source was frontend/package.json (both halves were bumped in lockstep).
#      This repo's version is pom.xml's <project><version>.
#   2. Release notes came from CHANGELOG.md, which stayed behind in the monorepo. Notes are
#      now generated by GitHub from the commits in the range.
#
# This tags the APPLICATION. The API contract is versioned separately via contract-v* tags —
# see publish-contract.yml and CONTRACT.md.

on:
  push:
    branches: [main]

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(scripts/project-version.sh)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: tag_check
        run: |
          if git tag | grep -qx "${{ steps.version.outputs.tag }}"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.tag_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --title "Release $TAG" --generate-notes
