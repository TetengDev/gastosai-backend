name: Publish API contract

# Publishes @tetengdev/gastosai-api-contract to GitHub Packages.
#
# There are two lanes into this workflow, and the first one is the mechanism that makes a
# publish guaranteed rather than remembered (TEN-345):
#
#   1. A push to `main` that MOVES the `version` field of contract/package.json. The workflow
#      publishes that version and then cuts the `contract-v<version>` tag itself. The tag is the
#      receipt of a successful publish, not its trigger — so a bump can no longer land untagged
#      and unpublished the way ten of them did between 2026-07-28 and 2026-09-04. A push to main
#      that leaves the version alone exits green and silent at the first job.
#
#   2. A `contract-v*` tag pushed by hand, kept for backfills and re-publishes of a commit that
#      predates lane 1.
#
# The tag lane still exists because lane 1 pushes its tag with the workflow's GITHUB_TOKEN, and
# GitHub deliberately does not re-trigger workflows from such a push — so lane 1 tags without
# re-entering this workflow, and lane 2 stays available for a human to drive.
#
# Bump rule: non-breaking -> minor; breaking -> major AND a new /api/v2 path with /api/v1 kept
# live until installed mobile clients have drained. See contract/README.md.

on:
  push:
    branches:
      - main
    tags:
      - 'contract-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Contract semver to publish (e.g. 1.1.0)'
        required: true

jobs:
  resolve:
    name: Decide whether a publish is due
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.decide.outputs.version }}
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags: the decision below reads the previous commit's
          # contract/package.json and the existing contract-v* tags.
          fetch-depth: 0

      - name: Resolve contract version
        id: decide
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          FILE_VERSION=$(jq -r '.version' contract/package.json)

          if [ -n "${INPUT_VERSION:-}" ]; then
            VERSION="$INPUT_VERSION"
            echo "Manual dispatch for $VERSION."
          elif [ "$REF_TYPE" = "tag" ]; then
            VERSION="${REF#contract-v}"
            echo "Tag lane: $REF."
          else
            VERSION="$FILE_VERSION"
            # The ordinary case is a push to main that does not touch the contract version.
            # It must stay silent, or the lane gets routed around.
            PREVIOUS=""
            if [ -n "${BEFORE:-}" ] \
               && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              PREVIOUS=$(git show "$BEFORE:contract/package.json" 2>/dev/null | jq -r '.version' || echo "")
            fi
            if [ "$PREVIOUS" = "$VERSION" ]; then
              echo "contract/package.json is still $VERSION — nothing to publish."
              echo "version=$VERSION" >> "$GITHUB_OUTPUT"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Contract version moved from '${PREVIOUS:-unknown}' to '$VERSION' on $REF."
          fi

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$VERSION' is not a semver version. Tag as contract-vX.Y.Z."
            exit 1
          fi

          # On the main lane an existing tag means this version was already published; publishing
          # again would 409 against the registry. The PR-time guard in continuous-integration.yml
          # ("Contract version is publishable") rejects that bump before it can get here, so this
          # is the second line, not the first.
          if [ "$REF_TYPE" != "tag" ] && git rev-parse -q --verify "refs/tags/contract-v$VERSION" >/dev/null; then
            echo "::notice::contract-v$VERSION already exists — $VERSION was published before. Nothing to do."
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

  publish:
    name: Generate spec and publish
    needs: resolve
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      # contents: write, because the main lane cuts the contract-v* tag once the publish succeeds.
      contents: write
      # Publishing uses the built-in GITHUB_TOKEN rather than a stored PAT: it is scoped to
      # this single run, expires with it, and needs no rotation. Sufficient here because the
      # @tetengdev package and this repo share the TetengDev owner.
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6.0.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@tetengdev'

      # Full suite: a published contract must come from a build that is green end to end.
      # OpenApiContractTest regenerates contract/openapi.json as part of this run.
      - name: Run tests and regenerate the spec
        run: ./mvnw --batch-mode test

      - name: Verify the spec is complete and current
        run: |
          set -euo pipefail
          test -s contract/openapi.json
          COUNT=$(jq '.paths | length' contract/openapi.json)
          echo "Spec documents $COUNT paths."
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::Generated spec documents no paths."
            exit 1
          fi
          if ! git diff --quiet -- contract/openapi.json; then
            echo "::error::This commit's contract/openapi.json is stale versus the code. Regenerate and commit before bumping the contract version."
            git --no-pager diff --stat -- contract/openapi.json
            exit 1
          fi

      - name: Set package version
        working-directory: contract
        run: npm version "${{ needs.resolve.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Publish to GitHub Packages
        working-directory: contract
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish

      # Only after the publish succeeded: the tag records what is on the registry. A tag that
      # exists but was never published is exactly the failure this workflow was rewritten to end,
      # so the order here is not incidental.
      - name: Tag the published commit
        if: github.ref_type != 'tag'
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "contract-v$VERSION" "$GITHUB_SHA"
          git push origin "contract-v$VERSION"
          echo "Tagged contract-v$VERSION at $GITHUB_SHA."

      - name: Summary
        run: |
          {
            echo "### Contract published"
            echo ""
            echo "\`@tetengdev/gastosai-api-contract@${{ needs.resolve.outputs.version }}\`"
            echo ""
            echo "Tagged \`contract-v${{ needs.resolve.outputs.version }}\`."
            echo ""
            echo "Clients must pin this **exact** version, run \`gen:api\`, and commit the regenerated output."
          } >> "$GITHUB_STEP_SUMMARY"
