name: Publish API contract

# Publishes @tetengdev/gastosai-api-contract to GitHub Packages.
#
# There are three lanes into this workflow, and the first one is the mechanism that makes a
# publish guaranteed rather than remembered (TEN-345):
#
#   1. A push to `main` that MOVES the `version` field of contract/package.json. The workflow
#      publishes that version and then cuts the `contract-v<version>` tag itself. The tag is the
#      receipt of a successful publish, not its trigger — so a bump can no longer land untagged
#      and unpublished the way ten of them did between 2026-07-28 and 2026-09-04. A push to main
#      that leaves the version alone exits green and silent at the first job.
#
#   2. A `contract-v*` tag pushed by hand, kept for backfills and re-publishes of a commit that
#      predates lane 1.
#
#   3. workflow_dispatch, for a publish someone has to drive by hand. It publishes and does NOT
#      tag: a dispatch can run against any ref, and a contract-v* tag pointing at a commit that
#      never reached main would say "this is what was published" about a commit nobody reviewed.
#      Tag it by hand afterwards (lane 2) if the publish should carry a receipt.
#
# The tag lane still exists because lane 1 pushes its tag with the workflow's GITHUB_TOKEN, and
# GitHub deliberately does not re-trigger workflows from such a push — so lane 1 tags without
# re-entering this workflow, and lane 2 stays available for a human to drive.
#
# Bump rule: non-breaking -> minor; breaking -> major AND a new /api/v2 path with /api/v1 kept
# live until installed mobile clients have drained. See contract/README.md.

on:
  push:
    branches:
      - main
    tags:
      - 'contract-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Contract semver to publish (e.g. 1.1.0)'
        required: true

# One publish at a time. Tag names are unique per version so two concurrent runs could not
# overwrite each other's receipt, but they could interleave a dispatch and a main-push publish of
# different versions, and queueing is free.
concurrency:
  group: publish-contract
  cancel-in-progress: false

jobs:
  resolve:
    name: Decide whether a publish is due
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.decide.outputs.version }}
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags: the decision below reads the previous commit's
          # contract/package.json and the existing contract-v* tags.
          fetch-depth: 0

      - name: Resolve contract version
        id: decide
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          FILE_VERSION=$(jq -r '.version' contract/package.json)

          # KNOWN_BUMP is set only on the main lane, and only when the previous commit's version
          # was actually readable — it is what lets an already-tagged version below be told apart
          # from an undecidable one.
          KNOWN_BUMP=no

          if [ -n "${INPUT_VERSION:-}" ]; then
            VERSION="$INPUT_VERSION"
            echo "Manual dispatch for $VERSION."
          elif [ "$REF_TYPE" = "tag" ]; then
            VERSION="${REF#contract-v}"
            echo "Tag lane: $REF."
          else
            VERSION="$FILE_VERSION"
            # The ordinary case is a push to main that does not touch the contract version.
            # It must stay silent, or the lane gets routed around.
            PREVIOUS=""
            if [ -n "${BEFORE:-}" ] \
               && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              PREVIOUS=$(git show "$BEFORE:contract/package.json" 2>/dev/null | jq -r '.version' || echo "")
            fi
            if [ "$PREVIOUS" = "$VERSION" ]; then
              echo "contract/package.json is still $VERSION — nothing to publish."
              echo "version=$VERSION" >> "$GITHUB_OUTPUT"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ -n "$PREVIOUS" ]; then
              KNOWN_BUMP=yes
              echo "Contract version moved from '$PREVIOUS' to '$VERSION' on $REF."
            else
              # github.event.before did not resolve — a force-push over main, or history GitHub has
              # collected. Whether the version moved is undecidable, so this falls through to the
              # tag check and is treated as a bump only if no tag claims the version already.
              echo "::warning::Could not read the previous commit's contract version (before=${BEFORE:-empty}). Deciding from the tags alone."
            fi
          fi

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$VERSION' is not a semver version. Tag as contract-vX.Y.Z."
            exit 1
          fi

          # An existing tag means this version was already published, so there is nothing to do.
          # What happens next depends on whether we know a bump just landed:
          #
          #   - We do (KNOWN_BUMP=yes) -> this run FAILS. A bump merged and will never publish,
          #     which is the TEN-345 failure exactly, one lane over. It happens when two PRs bump
          #     to the same version and the second is merged stale — the PR-time guard checked its
          #     base before the first one landed. Failing here is the whole point: the alternative
          #     is a green main and a version nobody publishes.
          #   - We do not -> exit green. The version is published, the tag proves it, and there is
          #     no evidence anything was expected to change.
          if [ "$REF_TYPE" != "tag" ] && git rev-parse -q --verify "refs/tags/contract-v$VERSION" >/dev/null; then
            if [ "$KNOWN_BUMP" = "yes" ]; then
              echo "::error::contract/package.json was bumped to $VERSION, but contract-v$VERSION already exists — that version is published and cannot be published again. This bump will never reach a client. Bump to an unused version (most likely this PR was merged stale, after another version bump landed)."
              exit 1
            fi
            echo "::notice::contract-v$VERSION already exists — $VERSION was published before. Nothing to do."
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

  publish:
    name: Generate spec and publish
    needs: resolve
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      # Read only. This job runs ./mvnw test and npm publish, so third-party build code executes
      # here; the token it executes beside must not be able to write refs. The tag push lives in
      # the separate `tag` job below, which runs no dependency code at all.
      contents: read
      # Publishing uses the built-in GITHUB_TOKEN rather than a stored PAT: it is scoped to
      # this single run, expires with it, and needs no rotation. Sufficient here because the
      # @tetengdev package and this repo share the TetengDev owner.
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6.0.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@tetengdev'

      # Full suite: a published contract must come from a build that is green end to end.
      # OpenApiContractTest regenerates contract/openapi.json as part of this run.
      - name: Run tests and regenerate the spec
        run: ./mvnw --batch-mode test

      - name: Verify the spec is complete and current
        run: |
          set -euo pipefail
          test -s contract/openapi.json
          COUNT=$(jq '.paths | length' contract/openapi.json)
          echo "Spec documents $COUNT paths."
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::Generated spec documents no paths."
            exit 1
          fi
          if ! git diff --quiet -- contract/openapi.json; then
            echo "::error::This commit's contract/openapi.json is stale versus the code. Regenerate and commit before bumping the contract version."
            git --no-pager diff --stat -- contract/openapi.json
            exit 1
          fi

      # The version reaches these steps through env rather than a ${{ }} expansion inside the
      # script body. It is regex-constrained to semver in `resolve`, so it is safe either way
      # today — but the inline form is the shape of an Actions script injection, and a guard one
      # edit away from being unsafe is not worth keeping for the characters it saves.
      - name: Set package version
        working-directory: contract
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Publish to GitHub Packages
        working-directory: contract
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish

      - name: Summary
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          {
            echo "### Contract published"
            echo ""
            echo "\`@tetengdev/gastosai-api-contract@$VERSION\`"
            echo ""
            echo "Clients must pin this **exact** version, run \`gen:api\`, and commit the regenerated output."
          } >> "$GITHUB_STEP_SUMMARY"

  # The receipt. Separate from `publish` for two reasons:
  #
  #   - Blast radius. contents: write is the only permission here, and this job runs no Maven or
  #     npm code — so a compromised build dependency in `publish` never executes beside a token
  #     that can push refs.
  #   - Ordering. `needs: publish` means the tag is written only after npm publish returned. A tag
  #     that exists without a package behind it is the TEN-345 failure in mirror image.
  #
  # Restricted to the push-to-main lane. A workflow_dispatch can run against any ref, and a
  # contract-v* tag on a commit that never reached main would claim a receipt for something
  # nobody reviewed.
  tag:
    name: Tag the published commit
    needs: [resolve, publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Cut and push the contract tag
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "contract-v$VERSION" "$GITHUB_SHA"
          git push origin "contract-v$VERSION"
          echo "Tagged contract-v$VERSION at $GITHUB_SHA."
          echo "Published \`@tetengdev/gastosai-api-contract@$VERSION\`, tagged \`contract-v$VERSION\`." >> "$GITHUB_STEP_SUMMARY"
